name: JantaNet CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "foundation/**"]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/jantanet?schema=public
      NEXT_PUBLIC_APP_URL: https://jantanet.example
      APP_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Generate Prisma Client
        run: npm run db:generate
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
