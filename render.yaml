services:
  - type: web
    name: jantanet
    runtime: node
    region: singapore
    plan: free
    branch: main
    buildCommand: npm install && npm run db:generate && npm run build
    startCommand: npm run db:deploy && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: NEXT_PUBLIC_APP_URL
        value: https://jantanet.onrender.com
      - key: DATABASE_URL
        sync: false
